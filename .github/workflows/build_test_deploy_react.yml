name: Build, Test and Deploy React Application

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_test_deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
        env:
          CI: true

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-react
          fail_ci_if_error: false
          verbose: true

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build

  publish:
    needs: build_test_deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Configure git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Build npm package
        run: npm run build-npm

      - name: Bump version and publish
        run: |
          npm version patch --no-git-tag-version
          git add package.json package-lock.json
          git commit -m "ci/CD"
          npm publish --access public
          git push
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-docker:
    needs: build_test_deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USER }}/frontend -f web/Dockerfile .
          docker push ${{ secrets.DOCKERHUB_USER }}/frontend

      - name: Build and push backend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USER }}/backend -f api/Dockerfile ./api
          docker push ${{ secrets.DOCKERHUB_USER }}/backend

  test-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env file
        run: echo "MYSQL_ROOT_PASSWORD=ynovpwd" > .env

      - name: Start the stack
        run: docker compose up -d --build

      - name: List running containers
        run: docker ps

      - name: Wait for all services to be healthy
        run: |
          containers="migration_container api adminer react"
          for i in $(seq 1 30); do
            all_healthy=true
            for c in $containers; do
              status=$(docker inspect --format "{{json .State.Health.Status }}" "$c" 2>/dev/null | jq -r '.')
              echo "$c -> $status"
              if [ "$status" != "healthy" ]; then
                all_healthy=false
              fi
            done
            if [ "$all_healthy" = "true" ]; then
              echo "All services are healthy"
              exit 0
            fi
            echo "Waiting for services... (attempt $i)"
            sleep 10
          done
          echo "Timeout: some services are not healthy"
          docker compose logs
          exit 1

      - name: Assert each container is healthy
        run: |
          for c in migration_container api adminer react; do
            echo "Checking $c"
            docker inspect --format "{{json .State.Health.Status }}" "$c" | jq -e '. == "healthy"'
          done

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Cypress run (Online mode)
        uses: cypress-io/github-action@v7
        with:
          build: npm run build
          start: npm start
          wait-on: 'http://localhost:3000'
        # Pas de CYPRESS_offline -> Cypress.env('offline') est falsy -> mode online

  e2e-offline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Run Cypress tests (Offline mode)
        uses: cypress-io/github-action@v7
        with:
          build: npm run build
          start: npm start
          wait-on: 'http://localhost:3000'
        env:
          # Cypress retire le préfixe CYPRESS_ et expose la clé "offline"
          CYPRESS_offline: true

  deploy-vercel:
    needs: build_test_deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build backend (Vercel)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy backend to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
